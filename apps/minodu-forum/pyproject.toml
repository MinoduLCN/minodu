[tool.coverage.run]
branch = true
source = [ "minodu_forum" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/apps/minodu-forum/html'
 --cov-report xml:'../../coverage/apps/minodu-forum/coverage.xml'
 --html='../../reports/apps/minodu-forum/unittests/html/index.html'
 --junitxml='../../reports/apps/minodu-forum/unittests/junit.xml'
"""

[tool.poetry]
name = "minodu-forum"
version = "1.0.0"
description = "Automatically generated by Nx."
authors = [
  "Lutz Reiter"
]
license = 'Proprietary'
readme = 'README.md'

  [[tool.poetry.packages]]
  include = "minodu_forum"

  [tool.poetry.dependencies]
  python = ">=3.12,<3.13"
  fastapi = "^0.116.1"
  requests = "^2.32.5"
  sqlalchemy = "^2.0.43"
  dotenv = "^0.9.9"
  aiofiles = "^24.1.0"
  httpx = "^0.28.1"
  python-multipart = "^0.0.20"
  pyjwt = "^2.10.1"
  uvicorn = "^0.35.0"
  pytest-timeout = "^2.4.0"
  pytest-asyncio = "^1.2.0"
  pymysql = "^1.1.2"
  celery = "^5.6.0"
  pydub = "^0.25.1"
  pillow = "^12.0.0"
  redis = "^7.1.0"
  cryptography = "^49.0.0"

  [tool.poetry.group.dev.dependencies]
  autopep8 = "2.3.1"
  flake8 = "7.1.1"
  black = "^24.3.0"
  ruff = "^0.1.15"
  mypy = "^1.8.0"
  pytest = "8.3.4"
  pytest-sugar = "1.0.0"
  pytest-cov = "6.0.0"
  pytest-html = "4.1.1"

# Black configuration
[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

# Ruff configuration
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]

# MyPy configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
exclude = [
    "tests/",
    "build/",
    "dist/",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
